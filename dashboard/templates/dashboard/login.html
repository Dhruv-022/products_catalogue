{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login | Al Baraq</title>
    <style>
        /* =========================================================
           GLOBAL RESET & LIGHT THEME BACKGROUND
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(96, 165, 250, 0.08) 0%, transparent 40%);
            color: #0f172a;
            padding: 24px;
            overflow-x: hidden;
        }

        /* =========================================================
           LOGIN CONTAINER & LIGHT GLASS CARD
        ========================================================= */
        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #ffffff;
            padding: 42px 36px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 
                0 15px 35px rgba(15, 23, 42, 0.06),
                0 4px 12px rgba(37, 99, 235, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 
                0 22px 45px rgba(15, 23, 42, 0.09),
                0 6px 18px rgba(37, 99, 235, 0.06);
        }

        /* =========================================================
           BRAND HEADER & GLOWING ORBIT LOGO
        ========================================================= */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-badge-wrapper {
            display: inline-flex;
            position: relative;
            margin-bottom: 20px;
            padding: 2.5px;
            border-radius: 50%;
            overflow: hidden;
        }

        .brand-badge-wrapper::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent,
                rgba(37, 99, 235, 0.12),
                #2563eb,
                #60a5fa,
                transparent 35%
            );
            animation: rotateLightBorderGlow 4.5s linear infinite;
            z-index: 0;
        }

        @keyframes rotateLightBorderGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-logo-container {
            position: relative;
            z-index: 1;
            width: 96px;
            height: 96px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.18);
        }

        .brand-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand h1 {
            font-size: 26px;
            font-weight: 850;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand h1 .highlight {
            color: #2563eb;
        }

        .brand p {
            font-size: 14px;
            color: #64748b;
            font-weight: 550;
        }

        /* =========================================================
           CONTINUOUS ORBITING INPUT FIELDS & REFINED LABELS
        ========================================================= */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        /* Outer Orbit Glow Wrapper */
        .input-orbit-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 1.5px;
            border-radius: 12px;
            overflow: hidden;
            background: #cbd5e1;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        /* Continuous Orbit Animation Pseudoelement */
        .input-orbit-wrapper::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent,
                rgba(37, 99, 235, 0.1),
                #2563eb,
                #60a5fa,
                transparent 35%
            );
            animation: rotateLightBorderGlow 4s linear infinite;
            z-index: 0;
            opacity: 1;
            transition: opacity 0.35s ease;
        }

        /* DISAPPEAR ORBIT WHEN FIELD IS FILLED */
        .input-orbit-wrapper.filled::before {
            opacity: 0;
            animation-play-state: paused;
        }

        .input-orbit-wrapper.filled {
            background: #cbd5e1;
            box-shadow: none;
        }

        /* Inner White Input Box Layer */
        .input-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            width: 100%;
            background: #ffffff;
            border-radius: 11px;
        }

        input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            border: none;
            border-radius: 11px;
            font-size: 14.5px;
            color: #0f172a;
            background-color: #ffffff;
            outline: none;
            font-family: inherit;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .input-orbit-wrapper:focus-within {
            box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.15);
        }

        /* =========================================================
           PASSWORD EYE TOGGLE BUTTON
        ========================================================= */
        .password-toggle {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s ease, background-color 0.2s ease;
            width: 34px;
            height: 34px;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #2563eb;
            background-color: #f1f5f9;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
        }

        /* =========================================================
           ERROR BANNER
        ========================================================= */
        .error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* =========================================================
           SUBMIT BUTTON
        ========================================================= */
        button[type="submit"] {
            width: 100%;
            height: 52px;
            border: 1px solid #2563eb;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 750;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
            margin-top: 6px;
        }

        button[type="submit"]:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <!-- Brand Header -->
            <div class="brand">
                <div class="brand-badge-wrapper">
                    <div class="brand-logo-container">
                        <img 
                            src="/media/logo/logo.png" 
                            alt="Al Baraq Logo" 
                            class="brand-logo-img"
                        >
                    </div>
                </div>
                <h1>Admin Panel <span class="highlight">Gateway</span></h1>
                <p>Webpage Management System</p>
            </div>

            <!-- Error Banner -->
            {% if error %}
                <div class="error">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <!-- Form -->
            <form method="POST">
                {% csrf_token %}

                <!-- Username Field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-orbit-wrapper">
                        <div class="input-inner">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username" 
                                required 
                                autocomplete="username"
                            >
                        </div>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-orbit-wrapper">
                        <div class="input-inner">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required 
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                id="togglePassword" 
                                aria-label="Toggle password visibility"
                                title="Show/Hide Password"
                            >
                                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit">Sign In to Dashboard</button>
            </form>

        </div>
    </div>

    <!-- JavaScript Logic: Orbit Hide/Show & Password Visibility Toggle -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            
            /* ---------------------------------------------------------
               1. DISAPPEAR ORBIT GLOW ON FILLED INPUT FIELDS
            --------------------------------------------------------- */
            const inputs = document.querySelectorAll('.input-inner input');

            function checkInputFill(input) {
                const wrapper = input.closest('.input-orbit-wrapper');
                if (wrapper) {
                    if (input.value.trim().length > 0) {
                        wrapper.classList.add('filled');
                    } else {
                        wrapper.classList.remove('filled');
                    }
                }
            }

            inputs.forEach(function (input) {
                checkInputFill(input);

                input.addEventListener('input', function () {
                    checkInputFill(this);
                });

                input.addEventListener('change', function () {
                    checkInputFill(this);
                });

                input.addEventListener('keyup', function () {
                    checkInputFill(this);
                });
            });


            /* ---------------------------------------------------------
               2. PASSWORD EYE SHOW/HIDE TOGGLE LOGIC
            --------------------------------------------------------- */
            const togglePassword = document.querySelector('#togglePassword');
            const passwordInput = document.querySelector('#password');
            const eyeIcon = document.querySelector('#eyeIcon');

            if (togglePassword && passwordInput && eyeIcon) {
                togglePassword.addEventListener('click', function () {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

                    if (isPassword) {
                        eyeIcon.innerHTML = `
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        `;
                        togglePassword.setAttribute('aria-label', 'Hide password');
                    } else {
                        eyeIcon.innerHTML = `
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        `;
                        togglePassword.setAttribute('aria-label', 'Show password');
                    }
                });
            }
        });
    </script>
</body>
</html>
