<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Delete {{ category.name }} | Al Baraq
    </title>

</head>


<body>

    <h1>
        Delete Category
    </h1>


    <p>

        Are you sure you want to permanently delete:

        <strong>
            {{ category.name }}
        </strong>

        ?

    </p>


    <p>

        <strong>
            Warning:
        </strong>

        Deleting this category will also delete all
        sub-categories belonging to it.

    </p>


    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirm Delete
        </button>

        <a href="{% url 'products:category_list' %}">
            Cancel
        </a>

    </form>


</body>

</html>
