<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Sub-Category | AI Baraq</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #172b4d;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
        }

        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .card {
            margin-top: 30px;
            background: white;
            border: 1px solid #e1e7ef;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        .warning {
            margin: 25px 0;
            padding: 18px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            color: #9a3412;
        }

        .subcategory-name {
            font-weight: bold;
            color: #172b4d;
        }

        .category-name {
            color: #64748b;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 11px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            border: none;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #172b4d;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

    <div class="container">

        <a
            href="{% url 'products:subcategory_list' %}"
            class="back-link"
        >
            ← Back to Sub-Categories
        </a>

        <div class="card">

            <h1>Delete Sub-Category</h1>

            <div class="warning">

                Are you sure you want to permanently delete

                <span class="subcategory-name">
                    "{{ subcategory.name }}"
                </span>

                from

                <span class="category-name">
                    {{ subcategory.category.name }}
                </span>

                ?

                <br><br>

                This action cannot be undone.

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="actions">

                    <button
                        type="submit"
                        class="btn btn-delete"
                    >
                        Delete Sub-Category
                    </button>

                    <a
                        href="{% url 'products:subcategory_list' %}"
                        class="btn btn-cancel"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
