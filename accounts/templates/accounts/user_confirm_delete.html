<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 40px; }
        .card { max-width: 480px; margin: 60px auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .danger-badge { color: #dc2626; font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        h3 { margin-top: 0; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: 500; font-size: 14px; text-decoration: none; cursor: pointer; border: none; }
        .btn-cancel { background: #e2e8f0; color: #334155; }
        .btn-confirm { background: #dc2626; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="danger-badge">Permanent Action</div>
        <h3>Delete User Account?</h3>
        <p>Are you sure you want to permanently delete <strong>{{ target_user.username }}</strong> ({{ target_user.full_name }})? All associated data and permissions will be removed immediately.</p>

        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <a href="{% url 'accounts:user_list' %}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-confirm">Confirm Delete</button>
            </div>
        </form>
    </div>
</body>
</html>
