<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Al Baraq Catalogue{% endblock %}</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 20px; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 24px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 14px; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .btn-login { background: #f1f5f9; padding: 6px 12px; border-radius: 6px; color: var(--text-main) !important; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 60px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'public:home' %}" class="logo">Al Baraq</a>
        <div class="nav-links">
            <a href="{% url 'public:home' %}">Home</a>
            <a href="{% url 'public:products' %}">Products</a>
            <a href="{% url 'public:about' %}">About Us</a>
            <a href="{% url 'public:contact' %}">Contact Us</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'dashboard:home' %}" class="btn-login">Dashboard</a>
            {% else %}
                <a href="{% url 'dashboard:login' %}" class="btn-login">Login</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        &copy; 2026 Al Baraq Catalogue. All rights reserved.
    </footer>
</body>
</html>
