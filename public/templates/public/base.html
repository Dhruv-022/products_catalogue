<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Al Baraq
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fa;

            color: #111827;

        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 70px;

            background: white;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 50px;

            position: sticky;

            top: 0;

            z-index: 1000;

        }

        .brand {

            font-size: 22px;

            font-weight: 700;

            color: #111827;

            text-decoration: none;

        }

        .nav-links {

            display: flex;

            align-items: center;

            gap: 30px;

            list-style: none;

        }

        .nav-links a {

            text-decoration: none;

            color: #374151;

            font-size: 14px;

            font-weight: 500;

        }

        .nav-links a:hover {

            color: #2563eb;

        }

        /* =========================
           MAIN CONTENT
        ========================= */

        main {

            min-height: calc(100vh - 70px);

        }

        /* =========================
           FOOTER
        ========================= */

        .footer {

            background: #111827;

            color: white;

            padding: 30px 50px;

            text-align: center;

            font-size: 14px;

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 0 20px;

            }

            .nav-links {

                gap: 15px;

            }

            .nav-links a {

                font-size: 13px;

            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <a
            href="{% url 'public:home' %}"
            class="brand"
        >
            Al Baraq
        </a>


        <ul class="nav-links">

            <li>
                <a href="{% url 'public:home' %}">
                    Home
                </a>
            </li>

            <li>
                <a href="{% url 'public:about' %}">
                    About Us
                </a>
            </li>

            <li>
                <a href="{% url 'public:products' %}">
                    Products
                </a>
            </li>

            <li>
                <a href="{% url 'public:contact' %}">
                    Contact Us
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================
         PAGE CONTENT
    ========================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <p>
            © {% now "Y" %} Al Baraq. All rights reserved.
        </p>

    </footer>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
